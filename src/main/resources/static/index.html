<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALS Panel</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body{
            background:#f4f7fc;
            font-family:'Segoe UI', sans-serif;
            margin:0;
        }

        .sidebar{
            width:260px;
            height:100vh;
            background:#111827;
            position:fixed;
            left:0;
            top:0;
            padding:30px 20px;
        }

        .sidebar h2{
            color:#3b82f6;
            font-size:42px;
            font-weight:bold;
            margin-bottom:50px;
        }

        .sidebar a{
            display:block;
            color:#d1d5db;
            text-decoration:none;
            padding:14px 18px;
            border-radius:14px;
            margin-bottom:15px;
            transition:0.3s;
            font-size:18px;
        }

        .sidebar a:hover{
            background:#1e40af;
            color:white;
        }

        .sidebar a.active{
            background:#2563eb;
            color:white;
        }

        .main{
            margin-left:260px;
            padding:40px;
        }

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:35px;
        }

        .doctor-box{
            background:white;
            padding:12px 22px;
            border-radius:16px;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);
            font-weight:600;
        }

        .dashboard-cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
            gap:25px;
            margin-bottom:35px;
        }

        .card-stat{
            background:white;
            padding:30px;
            border-radius:22px;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
        }

        .card-stat h2{
            font-size:42px;
            font-weight:bold;
            color:#2563eb;
        }

        .card-stat p{
            margin-top:10px;
            color:#6b7280;
            font-size:18px;
        }

        .patient-card{
            background:white;
            border-radius:22px;
            padding:30px;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
        }

        .table thead{
            background:#1d4ed8;
            color:white;
        }

        .table{
            border-radius:20px;
            overflow:hidden;
        }

        .btn-manage{
            background:#2563eb;
            color:white;
            border:none;
            border-radius:12px;
            padding:10px 18px;
            font-weight:600;
            text-decoration:none;
        }

        .btn-manage:hover{
            background:#1d4ed8;
            color:white;
        }

        .status-badge{
            background:#dcfce7;
            color:#166534;
            padding:8px 14px;
            border-radius:30px;
            font-size:14px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h2>ALS Panel</h2>

    <a href="index.html" class="active">
        Hastalar
    </a>
</div>

<div class="main">

    <div class="topbar">
        <div>
            <h1 class="fw-bold">ALS Doktor Paneli</h1>
            <p class="text-muted fs-5">ALS Hasta Takip Sistemi</p>
        </div>

        <div class="doctor-box">
            DOKTOR
        </div>
    </div>

    <div class="dashboard-cards">

        <div class="card-stat">
            <h2 id="hastaSayisi">0</h2>
            <p>Toplam Hasta</p>
        </div>

        <div class="card-stat">
            <h2 id="aktifSemptom">0</h2>
            <p>Aktif Semptom</p>
        </div>

        <div class="card-stat">
            <h2 id="kritikHasta">0</h2>
            <p>Kritik Hasta</p>
        </div>

    </div>

    <div class="patient-card">

        <div class="card p-4 mb-4 shadow-sm">
            <h4 class="mb-3">Yeni Hasta Ekle</h4>

            <div class="row g-2">

                <div class="col-md-4">
                    <input type="text"
                           id="firstName"
                           class="form-control"
                           placeholder="Ad">
                </div>

                <div class="col-md-4">
                    <input type="text"
                           id="lastName"
                           class="form-control"
                           placeholder="Soyad">
                </div>

                <div class="col-md-3">
                    <input type="text"
                           id="doctorName"
                           class="form-control"
                           placeholder="Doktor Adı">
                </div>

                <div class="col-md-1">
                    <button onclick="hastaEkle()"
                            class="btn btn-success w-100">
                        +
                    </button>
                </div>

            </div>
        </div>

        <h3 class="fw-bold mb-4">
            Kayıtlı Hastalar
        </h3>

        <table class="table table-hover align-middle">

            <thead>
            <tr>
                <th>Hasta Adı</th>
                <th>Doktor</th>
                <th>Durum</th>
                <th>İşlem</th>
            </tr>
            </thead>

            <tbody id="hastaListesi"></tbody>

        </table>

    </div>

</div>

<script>

    function hastalariGetir(){

        fetch("http://localhost:8080/api/patients")
            .then(res => res.json())
            .then(async patients => {

                document.getElementById("hastaSayisi").innerText =
                    patients.length;

                const tbody =
                    document.getElementById("hastaListesi");

                tbody.innerHTML = "";

                const symptomResponse =
                    await fetch("http://localhost:8080/api/symptoms");

                const symptoms =
                    await symptomResponse.json();

                document.getElementById("aktifSemptom").innerText =
                    symptoms.length;

                document.getElementById("kritikHasta").innerText =
                    symptoms.filter(x => x.severity >= 4).length;

                patients.forEach(h => {

                    tbody.innerHTML += `
                <tr>
                    <td>
                        <b>${h.firstName} ${h.lastName}</b>
                    </td>

                    <td>
                        ${h.doctorName || 'Atanmadı'}
                    </td>

                    <td>
                        <span class="status-badge">
                            Aktif Takip
                        </span>
                    </td>

                    <td>
                        <a href="symptom.html?id=${h.id}"
                           class="btn-manage">
                            Semptomları Yönet
                        </a>
                    </td>
                </tr>
            `;
                });
            });
    }

    function hastaEkle(){

        const data = {
            firstName:
            document.getElementById("firstName").value,

            lastName:
            document.getElementById("lastName").value,

            doctorName:
            document.getElementById("doctorName").value
        };

        fetch("http://localhost:8080/api/patients",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify(data)
        })
            .then(() => {

                document.getElementById("firstName").value="";
                document.getElementById("lastName").value="";
                document.getElementById("doctorName").value="";

                hastalariGetir();
            });
    }

    hastalariGetir();

</script>

</body>
</html>
