<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Hasta Semptom Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <a href="index.html" class="btn btn-secondary mb-3">
        ← Hasta Listesine Dön
    </a>

    <h2 class="mb-4">Semptom Yönetimi</h2>

    <div class="card p-4 mb-4 shadow-sm">
        <div class="row g-2">

            <div class="col-md-4">
                <input type="text"
                       id="sName"
                       class="form-control"
                       placeholder="Semptom Adı">
            </div>

            <div class="col-md-2">
                <input type="number"
                       id="sSev"
                       class="form-control"
                       placeholder="Şiddet">
            </div>

            <div class="col-md-4">
                <input type="text"
                       id="sNotes"
                       class="form-control"
                       placeholder="Notlar">
            </div>

            <div class="col-md-2">
                <button onclick="semptomEkle()"
                        class="btn btn-primary w-100">
                    Kaydet
                </button>
            </div>

        </div>
    </div>

    <table class="table table-hover bg-white shadow-sm">

        <thead class="table-dark">
        <tr>
            <th>Semptom</th>
            <th>Şiddet</th>
            <th>Not</th>
            <th>Tarih</th>
            <th>İşlem</th>
        </tr>
        </thead>

        <tbody id="symptomTableBody"></tbody>

    </table>

</div>

<script>

    const urlParams = new URLSearchParams(window.location.search);
    const hastaId = urlParams.get("id");

    function listele(){

        fetch("http://localhost:8080/api/symptoms")
            .then(res => res.json())
            .then(data => {

                const tbody =
                    document.getElementById("symptomTableBody");

                tbody.innerHTML = "";

                data
                    .filter(s => s.patient && s.patient.id == hastaId)
                    .forEach(s => {

                        const tarih = s.logDate
                            ? new Date(s.logDate).toLocaleDateString("tr-TR")
                            : new Date().toLocaleDateString("tr-TR");

                        tbody.innerHTML += `
                <tr>
                    <td>${s.symptomName}</td>
                    <td>${s.severity}</td>
                    <td>${s.notes}</td>
                    <td>${tarih}</td>
                    <td>
                        <button class="btn btn-danger btn-sm"
                                onclick="sil(${s.id})">
                            Sil
                        </button>
                    </td>
                </tr>
            `;
                    });
            });
    }

    function semptomEkle(){

        const data = {
            symptomName:
            document.getElementById("sName").value,

            severity:
            document.getElementById("sSev").value,

            notes:
            document.getElementById("sNotes").value
        };

        fetch(`http://localhost:8080/api/symptoms?patientId=${hastaId}`,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify(data)
        })
            .then(() => {

                document.getElementById("sName").value="";
                document.getElementById("sSev").value="";
                document.getElementById("sNotes").value="";

                listele();
            });
    }

    function sil(id){
        fetch(`http://localhost:8080/api/symptoms/${id}`,{
            method:"DELETE"
        })
            .then(() => listele());
    }

    listele();

</script>

</body>
</html>
