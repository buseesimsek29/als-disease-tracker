<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Hasta Semptom Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; }
        .btn-custom { transition: 0.3s; }
        .btn-custom:hover { transform: scale(1.02); }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a href="index.html" class="btn btn-outline-secondary">← Geri Dön</a>
            <h3 class="d-inline ms-3" id="hastaBaslik">Hasta Semptom Takibi</h3>
        </div>
        <a id="istatistikLink" href="#" class="btn btn-info text-white">📈 İstatistikleri Gör</a>
    </div>

    <div class="card p-4 shadow-sm mb-4">
        <div class="row g-3">
            <div class="col-md-4"><input type="text" id="sName" class="form-control" placeholder="Semptom Adı (örn: Kas Seyirmesi)"></div>
            <div class="col-md-2"><input type="number" id="sSev" class="form-control" placeholder="Şiddet (1-5)"></div>
            <div class="col-md-4"><input type="text" id="sNotes" class="form-control" placeholder="Notlar"></div>
            <div class="col-md-2"><button onclick="semptomEkle()" class="btn btn-success w-100 btn-custom">Kaydet</button></div>
        </div>
    </div>

    <table class="table table-hover bg-white shadow-sm rounded-3">
        <thead class="table-dark">
        <tr><th>Semptom</th><th>Şiddet</th><th>Not</th><th>İşlem</th></tr>
        </thead>
        <tbody id="symptomTableBody"></tbody>
    </table>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const hastaId = urlParams.get('id');

    // İstatistik linkini dinamik ayarla
    document.getElementById('istatistikLink').href = `istatistik.html?id=${hastaId}`;

    function listele() {
        fetch('http://localhost:8080/api/symptoms')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('symptomTableBody');
                tbody.innerHTML = '';
                data.filter(s => s.patient && s.patient.id == hastaId).forEach(s => {
                    tbody.innerHTML += `<tr>
                        <td>${s.symptomName}</td>
                        <td><span class="badge bg-primary">${s.severity}</span></td>
                        <td>${s.notes}</td>
                        <td><button class="btn btn-outline-danger btn-sm" onclick="sil(${s.id})">Sil</button></td>
                    </tr>`;
                });
            });
    }

    function semptomEkle() {
        const data = {
            symptomName: document.getElementById('sName').value,
            severity: document.getElementById('sSev').value,
            notes: document.getElementById('sNotes').value
        };
        fetch(`http://localhost:8080/api/symptoms?patientId=${hastaId}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        }).then(() => {
            alert('Semptom kaydedildi!');
            listele();
            // Formu temizle
            document.getElementById('sName').value = '';
            document.getElementById('sSev').value = '';
            document.getElementById('sNotes').value = '';
        });
    }

    function sil(id) {
        if(confirm("Bu kaydı silmek istediğine emin misin?")) {
            fetch(`http://localhost:8080/api/symptoms/${id}`, { method: 'DELETE' })
                .then(() => listele());
        }
    }

    listele();
</script>
</body>
</html>
