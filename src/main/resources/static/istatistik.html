<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İstatistik Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<div class="container mt-5">
    <a href="index.html" class="btn btn-secondary mb-3">← Geri Dön</a>
    <div class="card p-4 shadow-sm">
        <h4 id="hastaAdi">Hastanın Semptom Gelişimi</h4>
        <canvas id="semptomGrafigi" height="100"></canvas>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const hastaId = urlParams.get('id');

    fetch('http://localhost:8080/api/symptoms')
        .then(res => res.json())
        .then(data => {
            const hastaSemptomlari = data.filter(s => s.patient && s.patient.id == hastaId);

            const labels = hastaSemptomlari.map(s => s.symptomName);
            const veriler = hastaSemptomlari.map(s => s.severity);

            new Chart(document.getElementById('semptomGrafigi'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Semptom Şiddeti (1-5)',
                        data: veriler,
                        borderColor: '#0d6efd',
                        tension: 0.1
                    }]
                }
            });
        });
</script>
</body>
</html>
